name: Fetch run-reports artifact
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Optional single pipeline run ID
        type: string
      start:
        description: Inclusive UTC date
        default: '2026-08-01'
        type: string
      end:
        description: Exclusive UTC date
        default: '2026-11-01'
        type: string
      run_ids:
        description: Optional whitespace separated run IDs
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: run-reports-bridge
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and checksum immutable per-run reports
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          START: ${{ inputs.start }}
          END: ${{ inputs.end }}
          RUN_ID: ${{ inputs.run_id }}
          RUN_IDS: ${{ inputs.run_ids }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --start "$START" --end "$END" --out reports)
          if [ -n "$RUN_ID$RUN_IDS" ]; then
            printf '%s\n%s\n' "$RUN_ID" "$RUN_IDS" > "$RUNNER_TEMP/run-ids.txt"
            args+=(--run-ids "$RUNNER_TEMP/run-ids.txt")
          fi
          python -B tools/download_run_reports.py "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fetched-run-reports
          path: reports/
      - name: Export bridge snapshot
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f reports/manifest.json
          bridge=$(mktemp -d)
          cp -R reports "$bridge/reports"
          git -C "$bridge" init -b run-reports
          git -C "$bridge" config user.name 'github-actions[bot]'
          git -C "$bridge" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$bridge" add reports
          git -C "$bridge" commit -m "Report inventory for workflow $GITHUB_RUN_ID"
          auth=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          git -C "$bridge" -c "http.extraheader=AUTHORIZATION: basic $auth" push --force "https://github.com/$GITHUB_REPOSITORY.git" HEAD:refs/heads/run-reports
