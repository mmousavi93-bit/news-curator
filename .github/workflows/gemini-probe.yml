name: gemini-probe

# TEMPORARY diagnostic (Session 10B). Determines which (if any) gemini
# flash model the free-tier key actually serves via generateContent.
# workflow_dispatch only, ~30 s, no state/pipeline involved. Deleted after
# the decision. `contents: read` only.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe generateContent per candidate model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          for m in \
            gemini-3.8-flash \
            gemini-3.7-flash \
            gemini-3.6-flash \
            gemini-3.5-flash \
            gemini-3.5-flash-lite \
            gemini-2.5-flash-lite \
            gemini-flash-lite-latest \
            gemini-3-flash-preview; do
            code=$(curl -s -o /tmp/g.json -w "%{http_code}" \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              --data '{"contents":[{"role":"user","parts":[{"text":"ping"}]}]}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$m:generateContent")
            body=$(head -c 300 /tmp/g.json | tr '\n' ' ')
            echo "PROBE $m -> HTTP $code : $body"
          done
