name: gemini-probe

# TEMPORARY (Session 10B pattern, re-created 2026-09-15). Verifies which
# gemini free-tier flash/lite TEXT models are actually SERVING (generateContent
# 200 with tokens) vs merely LISTED, ahead of a possible pin to
# gemini-3.5-flash-lite (owner-reported 500 RPD, limits still unverified).
# Deleted after use. Invariants (SESSION_10B_BRIEF): permissions contents
# read only; keys in -H headers never the URL (logs are public); touches
# nothing -- no state, no pipeline, no push.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Probe generateContent per text flash/lite model
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set +e
          base="https://generativelanguage.googleapis.com/v1beta"
          models="gemini-3.8-flash gemini-3.7-flash gemini-3.6-flash gemini-3.5-flash gemini-3.5-flash-lite gemini-3.1-flash-lite gemini-3.1-flash-lite-preview gemini-3-flash-preview gemini-flash-lite-latest gemini-flash-latest"
          for m in $models; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 20 \
              -H "x-goog-api-key: $GEMINI_API_KEY" \
              -H "Content-Type: application/json" \
              -X POST \
              -d '{"contents":[{"parts":[{"text":"ping"}]}]}' \
              "$base/models/$m:generateContent")
            rc=$?
            if [ $rc -ne 0 ]; then
              echo "MODEL=$m HTTP=TIMEOUT(rc=$rc)"
              continue
            fi
            snip=$(head -c 260 /tmp/body | tr '\n' ' ')
            echo "MODEL=$m HTTP=$code BODY=$snip"
          done
