name: collect-test

# Manual only. Runs the Phase 3 collectors from a GitHub US runner -- the
# same network the pipeline actually runs on. The owner's network is in
# Iran and cannot reach most of these sources either way (TLS failures on
# western feeds, possible geoblocks on Iranian state media the other
# direction), so a local run would produce a false verdict regardless of
# outcome. See agents/briefs/PHASE_3_BRIEF.md, Gate section.
#
# agent.run --collect-only deliberately never raises on a single source
# failing -- one bad feed must never abort the run. Which means, exactly
# like send-test.yml's own lesson, a green job here would be meaningless
# unless the WORKFLOW ITSELF asserts pass/fail. This parses the structured
# JSON report rather than grepping log text, because the gate conditions
# (timestamp comparisons, per-source counts, an identical-timestamp check)
# are not reliably greppable the way send-test.yml's simpler string match is.

on:
  workflow_dispatch:

jobs:
  collect-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # A failed run re-run via "Re-run jobs" replays the run's ORIGINAL recorded
      # SHA, not the branch head, so a pushed fix silently does not execute. That
      # cost a round on 2026-08-19: the gate failed twice with a byte-identical
      # ynet timestamp while the fix sat in origin. Printing the SHA makes that
      # one grep instead of a timeline reconstruction. Validate a gate fix with a
      # fresh workflow_dispatch, never a re-run.
      - name: Identify the commit under test
        run: echo "running ${{ github.sha }}"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: pip install -e .

      - name: Record workflow start (UTC)
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S+00:00)" >> "$GITHUB_OUTPUT"

      - name: Run collectors
        run: python -m agent.run --collect-only --report-path /tmp/collect_report.json

      # Pass conditions, all four (PHASE_3_BRIEF.md Gate section):
      #   1. total_kept >= 160 (8 x 20, the corrected floor -- NOT 200, which
      #      is mathematically unreachable together with the >=8/10 clause
      #      under a 210-item post-cap ceiling).
      #   2. >=8 of the 10 enabled sources returned items, AND ynet_he plus
      #      all three telegram sources are among them.
      #   3. Every kept item's published_at predates this workflow's own
      #      start timestamp.
      #   4. No source's kept items all share one identical published_at --
      #      the exact signature of substituting datetime.now() for a
      #      missing date, which requirement 3 forbids.
      #   5. No source returns items with EVERY published_at null. Added
      #      2026-08-19; conditions 1-4 all passed while state_dept_travel
      #      contributed 30 undated items.
      #   6. No source's newest item is more than 14 days old. Added
      #      2026-08-19; conditions 1-4 all passed while tg_ukmto_mirror had
      #      been dormant since 2026-07-14 and is the only path to UKMTO.
      #      Age is elapsed time truncated to whole days, so a 36-calendar-day
      #      gap reports as 35. Do not reconcile the two numbers by eye.
      #
      # 5 and 6 are expected to FAIL on their first dispatch, on exactly those
      # two sources. That failure is their acceptance test -- a gate that is
      # only read passes; it must be attacked with the bug it exists to catch.
      - name: Assert the Phase 3 gate
        env:
          WORKFLOW_STARTED_AT: ${{ steps.started.outputs.at }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from datetime import datetime

          STALE_AFTER_DAYS = 14

          with open("/tmp/collect_report.json", encoding="utf-8") as fh:
              report = json.load(fh)
          started = datetime.fromisoformat(os.environ["WORKFLOW_STARTED_AT"])

          failures = []

          total_kept = report["total_kept"]
          if total_kept < 160:
              failures.append(f"total_kept {total_kept} < 160")

          sources = report["sources"]
          with_items = {sid for sid, s in sources.items() if s["kept"] > 0}
          if len(with_items) < 8:
              failures.append(f"only {len(with_items)}/10 enabled sources returned items, need >=8")

          required = set(report["required_source_ids"])
          missing_required = required - with_items
          if missing_required:
              failures.append(f"required sources missing from results: {sorted(missing_required)}")

          # The four required ids are in the thin slice specifically to force date
          # parsing: ynet_he's format defeated the probe's DATE_RE, and t.me/s/ has
          # no pubDate at all (times live in a <time datetime=...> attribute).
          # build_json_report drops None dates, so a source whose parser yields None
          # for EVERY item emits published_at == [] -- which the predates-start loop
          # skips and all_timestamps_identical reports False. Without this check the
          # gate greenlights total date failure on exactly the sources chosen to
          # prevent it, and Phase 6's 30-minute near-duplicate window silently dies.
          # Scoped to EVERY source, not just `required`. It was scoped to the four
          # required ids until 2026-08-19, and the first green run hid exactly the
          # bug it was written for one source to the left: state_dept_travel kept
          # 30 items with published_at == [] -- the only tier-1 source in the slice,
          # 15% of the corpus, entirely undated, reported as PASSED. The check was
          # right; its scope was not.
          for sid in sorted(sources):
              s = sources[sid]
              if s["kept"] > 0 and not s["published_at"]:
                  failures.append(f"{sid}: {s['kept']} items kept but every published_at is null -- date parsing failed")

          for sid, s in sources.items():
              for ts in s["published_at"]:
                  if datetime.fromisoformat(ts) >= started:
                      failures.append(f"{sid}: published_at {ts} does not predate workflow start {started.isoformat()}")
                      break
              if s.get("all_timestamps_identical"):
                  failures.append(f"{sid}: all kept items share one identical published_at")

              # Staleness. There was no such check until 2026-08-19, so
              # tg_ukmto_mirror passed while dormant since 2026-07-14 -- 36 days,
              # worse than the 31 that got IranWire cut -- and it is the ONLY
              # remaining path to UKMTO advisories, so maritime coverage read as
              # present while being zero. The probe cannot catch this: it emits an
              # empty `newest` for every t.me row, so no Telegram source has ever
              # been staleness-checked by any probe round.
              #
              # 14 days, not 7: State Dept advisories are legitimately infrequent
              # and a tighter bound manufactures failures on healthy sources, which
              # is how a gate stops being read. Sources with no dates at all are
              # skipped here -- the null check above already owns that case and one
              # defect should produce one failure line, not two.
              if s["published_at"]:
                  newest = max(datetime.fromisoformat(ts) for ts in s["published_at"])
                  age_days = (started - newest).days
                  if age_days > STALE_AFTER_DAYS:
                      failures.append(
                          f"{sid}: newest item {newest.isoformat()} is {age_days} days old "
                          f"(> {STALE_AFTER_DAYS}) -- source is dormant, not merely quiet"
                      )

          print(json.dumps(report, indent=2))
          if failures:
              print("\nGATE FAILED:")
              for f in failures:
                  print(f"  - {f}")
              sys.exit(1)
          print("\nGATE PASSED.")
          PY
