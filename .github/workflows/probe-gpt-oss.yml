name: Probe GPT-OSS (groq2 model diversity)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Probe gpt-oss-20b + gpt-oss-120b for the understand task
        env:
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
        run: python3 tools/probe_gpt_oss.py | tee outputs/gpt_oss_probe.txt
      - name: Commit probe output back to main
        # Azure-backed job logs are often unreachable from Iran, so the probe
        # output is committed to the repo instead -- git push over api.github.com
        # is the one channel that reliably works (same trick as pipeline.yml's
        # state-branch force-push).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/gpt_oss_probe.txt
          git commit -m "probe: gpt-oss understand-task result" || echo "no change to commit"
          git push origin main
