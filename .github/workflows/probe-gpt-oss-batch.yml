name: Probe GPT-OSS batch shape (5-cluster array)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Probe gpt-oss-120b on the production 5-cluster batch shape
        env:
          GROQ_API_KEY_2: ${{ secrets.GROQ_API_KEY_2 }}
        run: |
          python3 tools/probe_gpt_oss_batch.py > gpt_oss_batch_probe.txt 2>&1 || true
      - name: Publish probe output to probe-results branch
        if: always()
        # Azure-backed job logs are often unreachable from Iran; push output to
        # an orphan branch instead (same trick as probe-gpt-oss.yml).
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-results
          git rm -rf . >/dev/null 2>&1 || true
          cp gpt_oss_batch_probe.txt probe_result_batch.txt
          git add probe_result_batch.txt
          git commit -m "probe: gpt-oss batch-shape result $(date -u +%Y%m%dT%H%M%SZ)"
          git push -f origin probe-results
