[project]
name = "news-curator"
version = "0.1.0"
description = "Personal geopolitical/military/macro intelligence agent. Free-tier, unattended, Telegram delivery."
requires-python = ">=3.11"
dependencies = [
    # Parses config/*.yaml -- the owner-editable interface. Only third-party runtime dep in Phase 1.
    "PyYAML>=6.0",
    # Phase 2: Telegram Bot API client (sendMessage). Deliberately not
    # python-telegram-bot or any async framework -- constraint 6 forbids
    # Telethon/MTProto and the brief calls for a plain synchronous HTTP call.
    "requests>=2.31",
    # NumPy deliberately NOT added in Phase 6: the greedy clusterer uses
    # running centroids over ~120 unseen items/run, which pure Python does
    # in well under a second. Add it only when a profile says so -- an
    # unused dependency violates constraint 13 harder than a missing one.
]

[project.optional-dependencies]
dev = [
    # Test runner. Required by the Phase 1 gate command (agents/briefs/PHASE_1_BRIEF.md).
    "pytest>=8.0",
]
# Phase 6: local multilingual MiniLM embeddings (ARCHITECTURE.md tech
# choices). Optional because torch is ~2 GB -- the owner's Windows pytest
# suite and --dry-run must run without it; CI installs `.[embeddings]`.
embeddings = [
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
