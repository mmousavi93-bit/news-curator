  strategic:
    # Anchors only (2026-09-05). Previously the generic military nouns
    # (جنگ، حمله، موشک، جنگنده، تسلیحات…) fired strategic on their own, so
    # a Greek airshow crash ("جنگنده") and a Pentagon polygraph story
    # ("تسلیحات") LED the digest with zero Iran relevance. Strategic now
    # means a REGIONAL anchor is named: a ring state, Palestine/Gaza, a
    # regional actor, a maritime/diplomatic instrument. An unplaced
    # "attack"/"fighter jet"/"missile" is off-mission and drops -- the same
    # detection-is-not-relevance rule, enforced here instead of the prompt.
    # Kept from the 2026-08-30 calibration: the ring states (E4/E6),
    # اسرائیل/israel (crime-blotter defense lives in the understand prompt),
    # and the deliberately-absent blotter magnets (بازداشت، سلاح، بمب،
    # نتانیاهو، نشست/وزیران، زندانی/اسیر). Added: غزه/فلسطین (the Masafer
    # Yatta class of gap -- a Gaza ceasefire had no anchor), برجام to
    # iran_direct (the nuclear anchor).
    #
    # Added 2026-09-06 (fix 4), two measured gaps:
    # (1) "یمن"/"yemen" already anchors the COUNTRY, but a Yemen-war story
    #     datelined to a specific actor or city never says the country name
    #     -- انصارالله/ansarullah, حوثی/houthi, تعز/taiz, صنعا/sanaa,
    #     الحدیده/hodeidah close that.
    # (2) Putin/Witkoff/Kushner Moscow talks (importance 10.99) were
    #     relevance-gated out entirely -- US-Russia dealmaking over
    #     Ukraine reshapes sanctions and oil markets Iran depends on, so it
    #     is a strategic anchor the same way the Mecca Defense Pact is.
    #     DELIBERATELY NOT ADDED: bare اوکراین/ukraine, کییف/kyiv,
