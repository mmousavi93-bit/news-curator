# Digest-ranking relevance tiers (owner-editable).
#
# Owner decision 2026-08-30: digest order is relevance-to-Iran first,
# category second. This file is a DETERMINISTIC, zero-LLM approximation of
# "does this matter for Iranian people": the scorer matches these keywords
# against the event's headline + summary + entities (already produced by
# the understand stage) and adds the highest matching tier's weight to the
# digest score. No new LLM calls. Identical input -> identical order.
#
# Three tiers, highest match wins (not additive):
#   iran_direct  - the event names Iran or Iranian institutions directly.
#   strategic    - regional war/military/diplomatic developments that shape
#                  Iran's security environment even when Iran is not named
#                  (the Mecca Defense Pact case: no "Iran" in the text, but
#                  a Turkish-Saudi-Pakistani defense alignment is exactly
#                  what an Iranian reader needs at the top).
#   economy      - global markets/sanctions/oil moves that hit Iranian
#                  wallets.
# Anything matching no tier gets no bonus -- category and recency decide.
#
# Keywords are Persian, English AND Hebrew (entities can arrive in any of
# these; the output contract says Persian, the fallback model does not
# always obey; two tier-2 sources -- walla, maariv -- are Hebrew). Added
# 2026-09-06 (round-3 review, fix 1b): the scorer previously had zero
# Hebrew anchors, so every Hebrew item scored 0 regardless of content.
# Matching is over agent.flash.textnorm.normalize()'d text against
# normalize()'d keywords (fix 1a) -- NFC + ZWNJ-strip + Arabic->Persian
# orthography folding + digit folding + lowercase, so Arabic and Persian
# spellings of the same word meet in the same space (إيران/ایران,
# غزة/غزه, إسرائيل/اسرائیل). Persian spelling follows the output contract
# (ی/ک, never ي/ك) but Arabic-spelled variants now match too -- add new
# variants here, no code change. Hebrew has no case and is unaffected by
# the folding table.
#
# Round-4 review, fix 4 (2026-09-08): Arabic has no پ/گ/ژ/چ, so Arabic
# sources write Persian names/terms with the nearest Arabic letter --
# ب for پ, ك (folds to ک) for گ, ز for ژ, ج for چ. That substitution is a
# SPELLING CHOICE by the source, not an orthographic variant the fold
# table can absorb (folding پ->ب in code would make every legitimate
# Arabic ب match پ-words too broadly). Fix: explicit substituted keyword
# next to each Persian original that contains one of those four letters --
# same precedent as بزشکیان next to پزشکیان (2026-09-06). Measured:
# al_manar's two Putin/Trump-envoy items (بوتين) scored 0.0 before this
# fix, 4.0 after (config/relevance.yaml:100-103 already made US-Russia
# dealmaking on-mission for the Persian spelling).
weights:
  iran_direct: 8
  strategic: 4
  economy: 3

# FILTER threshold (owner decision 2026-08-30, session 9c-v2): an event whose
# highest matched tier is BELOW this never reaches the digest -- relevance is a
# gate, importance is the sort. Default 3 = economy tier passes (macro moves
# matter). Set 4 for strategic-only, 8 for Iran-direct-only.
min_relevance: 3

