    - "tehran"
    - "irgc"
    - "khamenei"
    - "persian gulf"
    - "strait of hormuz"
    # Hebrew anchors (fix 1b, 2026-09-06) -- iran_direct = Iran-proper terms.
    - "איראן"
    - "איראני"
    - "טהראן"
    - "משמרות המהפכה"
