# flash_alert.yaml — Tehran explosion flash monitor.
# Deterministic, ZERO LLM calls, owner-editable (2026-08-30, owner-approved
# design: 15-min scans, 24/7, unverified-OK alerts with burst cleaning).
#
# Loader (agent/flash/config.py) validates shape strictly: a typo fails the
# run loudly, never silently widens or narrows the alert.
#
# SEMANTICS: an alert fires when one of the CLASS's term buckets AND one of
# its location rings both match an item published in the last
# `freshness_minutes`. Term = substring; single-word location = whole-token
# (so «ری» never matches «خبری»); multi-word locations match as phrases.
# Global exclusions kill any fire (substring, full text).
# Burst signature = class|term_bucket|location_ring — one first alert plus
# at most 2 source-count follow-ups per burst. Repetition over sources is
# AMPLIFICATION, never corroboration — every message carries the
# «تأیید نشده» label (standing rumour policy).
#
# The escalation class was REMOVED 2026-09-13 (session 9Y): regional
# tension escalation is a trend, not an event — it belongs to the 3-hourly
# digest, not a 15-min channel. This monitor is now the single life-safety
# signal: an explosion / air attack reported in or near Tehran.

version: 3

enabled: true

# FAST SUBSET (owner decision 2026-08-30): the burst signal lives in
# Telegram first. The full sweep stays the 3-hourly pipeline's job — a
# 16x request-rate hike (96 vs 6 fetches/day per source) on every feed
# risks 403/429 source cuts (unfixable).
flash_source_ids:
  - tg_wfwitness
  - tg_tabzlive
  - tg_tweet_mardomi
  - tg_iranian_militarism
  - tg_geopolitics_prime
  - tg_geopwatch
  - osint613_a
  - al_manar
  - sky_news_arabia

matching:
  freshness_minutes: 120      # only items published in the last 2h can fire
  window_chars: 300           # buckets must appear in title + first 300 chars

burst:
  collapse_window_minutes: 30 # tehran collapse window
  followup_window_minutes: 90 # after first sighting, alerts stop; digest owns it
  followups: [3, 8]           # at most 2 per event; count = distinct source ids

caps:
  max_alerts_per_hour: 3      # NEW-event first alerts, ALL classes; FUs exempt
  # Cap hit -> defer, never drop: the burst stays open, the next scan
  # re-evaluates. Window expiry -> items flow to the 3-hourly digest.

exclusions:
  # substring over FULL title+body; ANY hit kills the fire. «شایعه» is
  # deliberately NOT here: a hedged early post is the best alert there is.
  # Space variants sit BESIDE the ZWNJ forms: normalization strips ZWNJ
  # but never collapses spaces, so «آتش بازی» would evade «آتش‌بازی»
  # (reviewer finding 2026-08-31).
  fa: [سالگرد, یادبود, قدیمی, آرشیو, دیروز, دیشب, شب گذشته, فیلم, سینما, تئاتر,
       سریال, آتش‌بازی, آتش بازی, تکذیب, کذب, بی‌اساس, بی اساس, نقشه, بازداشت,
       دستگیری, خنثی, کشف شد, تحلیل, یادداشت, سرمقاله]
  en: [anniversary, memorial, archive, yesterday, last night, film, movie,
       theater, fireworks, denied, denial, no evidence, unsubstantiated,
       plot, planned, arrested, defused, discovered, cyber, hack, analysis, op-ed]
  ar: [فيلم, سينما, مسلسل, ذكرى, أرشيف]

classes:
  tehran:
    label: "هشدار انفجار"
    quiet_hours: 24             # closed burst: same signature re-fires only at
    quiet_requires_sources: 3   # >=3 sources (FP-repeat + re-surface defense)
    terms:
      explosion:
        fa: [انفجار, صدای انفجار, بمب, مهیب, ترکش]
        en: [explosion, blast, bomb]
        ar: [انفجار, صوت انفجار, قنبلة]
      attack_air:
        fa: [موشک, موشک‌باران, حمله هوایی, حمله موشکی, پهپاد, پدافند, دفاع هوایی, رهگیری]
        en: [missile, drone, airstrike, air raid, air strike, rocket, interception, air defense, air defence]
        ar: [صواريخ, غارة, مسيرة, قصف, دفاع جوي]
      # ABSENT BY DESIGN (digest's job): تیراندازی/shooting, آتش‌سوزی/fire, cyber.
      # ACCEPTED: گاز/gas blasts fire via «انفجار» — a building blast in
      # Tehran is emergency information regardless of cause.
    locations:
      city:  # تهران + districts + landmarks; the template names the matched token
        fa: [تهران, تهرانپارس, تجریش, ونک, پاسداران, شمیران, سعادت‌آباد, سعادت آباد,
             نارمک, ازگل, میدان آزادی, میدان ولیعصر, فرودگاه مهرآباد, بازار تهران]
        en: [tehran, tehranpars, tajrish, shemiran, mehrabad]
      region:  # استان تهران + metro ring
        fa: [کرج, پردیس, قرچک, شهریار, ری, ورامین, پاکدشت, لواسان, ملارد, اسلامشهر,
             بهارستان, رباط‌کریم, رباط کریم, دماوند, فیروزکوه, پیشوا, قدس, گلستان]
        en: [karaj, pardis, varamin, pakdasht, rey, lavasan]

templates:
  first: |
    🚨 {label}
    {headline}
    📍 {location_token}
    📡 منابع: {first_source}{more_sources}
    ⏱ {jalali} — {tehran_time}
    «تأیید نشده»
  followup: |
    🚨 به‌روزرسانی — {n} منبع گزارش می‌دهند
    {label}
    {headline}
    «تأیید نشده»
  system_down: |
    ⚠️ سیستم هشدار از کار افتاده است (رمزگشایی state ناموفق یا خطای بحرانی).
    تا رفع مشکل، به مرور اخبار عادی تکیه کنید.
