# settings.yaml — thresholds, schedules, feature flags
#
# Every value the owner might want to change lives here. Nothing in this file
# should require reading Python to understand.
#
# WARNING: values marked [BACKTESTED] are validated by analysis/backtest_weights.py.
# Changing one without re-running that script invalidates the only proof the
# scoring works. Do not tune them by feel.

version: 1

# ---------------------------------------------------------------------------
# SCHEDULE
# ---------------------------------------------------------------------------
schedule:
  timezone: "Asia/Tehran"

  # Pipeline runs every 3 hours (8/day). Owner chose per-run delivery over
  # threshold-only. Runs with no score change send a short honest one-liner.
  pipeline_cron: "0 */3 * * *"

  # DECISION 1 — the canonical daily evaluation.
  #
  # The scoring rulebook is day-granular: AGE is in whole days, half-lives are in
  # days, and Step 12 counts "7 consecutive DAILY evaluations". Running 8x/day
  # made that ambiguous (7 days or 56 runs?). Resolved: the 07:00 digest run is
  # THE daily evaluation. Regime counters, the trailing 7-day mean, and novelty
  # cycles advance only there.
  #
  # Intra-day runs still compute and report scores — a new signal dated today
  # gets AGE 0 and registers within 3 hours — but they never advance regime state.
  # This keeps WARTIME entry/exit deterministic.
  digest_cron: "0 7 * * *"
  canonical_daily_run: "07:00"

  # A skipped or delayed GitHub cron must not lose data.
  lookback_hours: 6

# ---------------------------------------------------------------------------
# COLLECTION
# ---------------------------------------------------------------------------
collection:
  max_items_per_source: 20
  concurrency: 8
  per_source_timeout_seconds: 10
  respect_robots_txt: true
  user_agent: "news-curator/1.0 (personal research agent)"

  # A source that yields zero parseable items this many runs in a row is marked
  # degraded and reported in the daily digest. It is not silently dropped.
  degraded_after_empty_runs: 3

# ---------------------------------------------------------------------------
# PIPELINE BUDGETS
# ---------------------------------------------------------------------------
pipeline:
  # Hard ceiling. Gemini free tier is 10 RPM / 1500 RPD; exceeding this breaks
  # the run. Overflow clusters are DEFERRED to the next run, never dropped.
  # Deferral priority: highest candidate signal weight first.
  max_clusters_per_run: 40
  max_vision_calls_per_run: 10

  # Cosine similarity for agglomerative clustering. UNTUNED — placeholder until
  # Phase 6 measures it on real multilingual data. Expect to change.
  cluster_similarity_threshold: 0.62

  # Matching a new cluster to an already-open event in memory.
  event_match_threshold: 0.55

  # Images below this are logos/avatars, never sent to vision.
  vision_min_image_bytes: 20000

# ---------------------------------------------------------------------------
# RETENTION
# ---------------------------------------------------------------------------
# DECISION 2 — split retention. A flat 30 days silently corrupts scores.
#
# H1 has a 30-day half-life: a state that ended 60 days ago still contributes
# 12 x 0.8 x 0.5^2 = 2.4 points. C5's half-life is 21 days. Rulebook Step 2
# novelty needs per-signal fire history across multiple 14-day quiet cycles.
# D2/D3 need a full 30-day rhetoric baseline PER SPEAKER before they work at all.
#
# Signal rows are ~60 bytes. 180 days costs about 2 MB. Cheap insurance against
# permanently under-contributing stateful signals.
retention:
  url_hashes_days: 7          # was 30 — pure dedup, no scoring value after a week
  events_days: 30             # the RAG. "has this happened before" window
  embeddings_days: 30         # must match events_days
  signal_events_days: 180     # NEW — feeds decay, novelty, posture persistence
  speaker_statements_days: 45 # NEW — D2/D3 need a 30d baseline plus headroom
  score_history_days: 365     # NEW — trailing means, trend charts, calibration
  scheduled_events_days: 365  # registry: past entries prove ghost-meeting patterns

# ---------------------------------------------------------------------------
# SCORING
# ---------------------------------------------------------------------------
scoring:
  # [BACKTESTED] Do not change without re-running analysis/backtest_weights.py.
  tier_multipliers:
    1: 1.0
    2: 0.8
    3: 0.5

  # [BACKTESTED] Rulebook Step 1. Tier-3 sources nominate, they never corroborate.
  min_independent_sources: 2
  tier3_can_corroborate: false

  # [BACKTESTED] Rulebook Step 3. Stateful signals decay from state END, not first
  # report. Without this, Feb 21 2026 scores 40.1 against a 55-70 target; with it,
  # 63.9. This single rule is the difference between 4/5 and 5/5 on the backtest.
  stateful_decay_from_state_end: true

  # [BACKTESTED] Steps 7, 8, 9.
  category_caps: { D: 20, G: 10 }
  convergence_step: 0.15
  convergence_max: 1.6
  deception_multiplier: 1.3
  deception_window_hours: 72

  # [BACKTESTED] Step 2.
  novelty_quiet_days: 14
  novelty_decay_factor: 0.6
  novelty_floor: 0.3
  novelty_reset_min_contribution: 15

  # DECISION 3 — persist the uncapped score.
  #
  # Jun 11 2025 computes to 176.4 and displays 100.0. Feb 27 2026 STRAT also pins
  # at 100. Once saturated, Step 12 rule (i) — "TACT >= trailing 7-day mean + 10" —
  # is mathematically dead, because 100 can never exceed 110. Store both: display
  # the capped value, compute deltas on the uncapped one. Rule (i) starts working
  # again inside WARTIME, which is exactly when you need it.
  display_cap: 100
  persist_uncapped: true
  delta_basis: "uncapped"

  tier_bands:                 # [BACKTESTED] Step 11
    0: [0, 14.9]
    1: [15, 34.9]
    2: [35, 54.9]
    3: [55, 74.9]
    4: [75, 100]

# ---------------------------------------------------------------------------
# ALERTING — message layer only. Never modifies a score. (Rulebook Step 12)
# ---------------------------------------------------------------------------
alerting:
  wartime_enter_tact: 75
  wartime_enter_consecutive_days: 7
  wartime_exit_tact: 55
  wartime_exit_consecutive_days: 7
  wartime_delta_trigger: 10       # vs trailing 7-day mean, computed on UNCAPPED
  new_dimension_silent_days: 14   # a category silent this long going loud = alert
  exit_from_wartime_is_full_alert: true   # de-escalation is news

# ---------------------------------------------------------------------------
# MARKETS
# ---------------------------------------------------------------------------
# DECISION 5 — stop fetching daily-close series eight times a day.
#
# VIXCLS, T10Y2Y and BAMLH0A0HYM2 publish once daily. Fetching them per run was
# 64 requests/day for 8 useful values. Intraday series (oil, gold, equities) still
# move within the day and matter for G1, so those stay per-run.
markets:
  fred_api_key_env: "FRED_API_KEY"   # free, no card. Keyless fredgraph.csv works
                                     # but is undocumented and fragile.
  daily_series:                      # fetched on canonical_daily_run, or if stale
    - { id: "VIXCLS",        source: "fred",  label: "VIX" }
    - { id: "BAMLH0A0HYM2",  source: "fred",  label: "HY credit spread" }
    - { id: "T10Y2Y",        source: "fred",  label: "10y-2y curve" }
  intraday_series:                   # fetched every run
    - { id: "cb.f",  source: "stooq", label: "Brent" }
    - { id: "cl.f",  source: "stooq", label: "WTI" }
    - { id: "xauusd", source: "stooq", label: "Gold" }
    - { id: "^spx",  source: "stooq", label: "S&P 500" }
    - { id: "usdirr", source: "manual", label: "USD/IRR open market" }
  daily_stale_after_hours: 12
  # [BACKTESTED] G-signal trigger thresholds
  triggers:
    oil_daily_move_pct: 5.0
    gold_daily_move_pct: 3.0

# ---------------------------------------------------------------------------
# LLM ROUTING
# ---------------------------------------------------------------------------
# DECISION 6 — Gemini for v1. Haiku wired but DISABLED pending measurement.
#
# Anthropic Haiku 4.5 is $1/MTok in, $5/MTok out. Measured against this pipeline:
#   wholesale swap, no caching ......... ~$60/month
#   wholesale swap, in-run caching ..... ~$38/month
#   Gemini triage -> Haiku adjudicate ... ~$11/month
#   status quo, all Gemini free ........   $0/month
#
# Extraction is the one stage where model quality compounds, because a missed or
# hallucinated signal propagates into a deterministic score. That is a real
# argument. It is NOT yet a measured one — there is no pipeline and no extraction
# data. Phase 7 measures Gemini's extraction F1 against the hand-labelled signal
# sets already specified in the five backtest scenarios. Decide then.
#
# If enabled: use the cascade, not the swap. Vision and compose stay on Gemini —
# transcribing an image and writing prose are low-leverage and errors there are
# cosmetic, not scoring.
#
# NOTE: Haiku 4.5 predates the tokenizer that emits ~30% more tokens for identical
# text. Do not "upgrade" to a later Haiku without recomputing the table above;
# headline rate can be unchanged while real cost rises a third.
llm:
  order: ["gemini", "groq", "openrouter"]

  stages:
    vision:    { provider: "gemini" }
    compose:   { provider: "gemini" }
    understand:
      provider: "gemini"
      # Flip to true only after the Phase 7 gate passes/fails on evidence.
      cascade_enabled: false
      cascade_adjudicator: "anthropic"
      # Only clusters where the triage pass reported >=1 candidate signal are
      # re-adjudicated. Quiet days ~5-8 clusters, war days 20+.
      cascade_trigger: "any_candidate_signal"

  providers:
    gemini:
      model: "gemini-2.5-flash"
      rpm: 10
      rpd: 1500
      supports_vision: true
    groq:
      model: "llama-3.3-70b-versatile"
      rpm: 30
      rpd: 14400
      supports_vision: false
    openrouter:
      rpm: 20
      rpd: 50          # emergency parachute, not a real fallback
      supports_vision: false
    anthropic:
      enabled: false
      model: "claude-haiku-4-5"
      supports_vision: true
      prompt_cache: true          # catalog is ~2700 tokens, above the 2048 minimum
      # CONSTRAINT 15 — an unattended process on a metered API needs a hard stop.
      # A retry loop costs nothing on Gemini and a rent payment on Anthropic.
      max_calls_per_run: 15
      max_spend_usd_per_month: 20
      halt_on_budget_exceeded: true

  backoff:
    max_retries: 3
    base_delay_seconds: 2
    circuit_breaker_failures: 5   # then degrade: collect + store, deliver a notice

# ---------------------------------------------------------------------------
# DELIVERY
# ---------------------------------------------------------------------------
delivery:
  telegram_max_chars: 4096
  # Budget explicitly. Never discover the limit at send time.
  char_budget:
    header: 200
    top_events: 2200
    risk_block: 900
    watchlist: 500
    footer: 150
  truncate_priority: ["watchlist", "top_events", "risk_block"]
  output_language: "en"
  source_languages: ["en", "fa", "ar", "he"]

# ---------------------------------------------------------------------------
# OPERATIONS
# ---------------------------------------------------------------------------
ops:
  mock_mode: false          # true = no network, fixtures only. Used by all tests.
  dry_run: false            # run everything, send nothing
  halt_on_state_decrypt_failure: true   # constraint 14. Never start from empty.
  halt_on_db_integrity_failure: true
  # DECISION 6b — startup coverage check. A source covering no signal is dead
  # weight; a signal covered by no source can never fire and you would never know.
  require_signal_coverage_check: true
  coverage_check_fails_build: false     # warn in digest, do not block the run
