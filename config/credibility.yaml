# DEFAULTS for a source not listed above
# ---------------------------------------------------------------------------
# CHANGED 2026-08-17 after adversarial review of LEAD_HANDLING.md rev 1.
# `group: null` here was a live hole: null resolves to "own id", so every unlisted
# source counted as fully independent. Twelve Telegram channels reposting one original
# would have registered as twelve independent confirmations -- exactly the failure
# DECISION 4 was written to prevent, arriving through the defaults block instead.
# Unlisted sources now SHARE one group, so they can never corroborate each other.
# Being unknown must fail toward silence, not toward confidence.
defaults:
  tier: 3                   # unknown sources are assumed weakest, never strongest
  group: unlisted           # shared -> unlisted sources cannot corroborate each other
  warn_on_unlisted: true    # surface unlisted sources in the daily digest so the
                            # owner can tier them deliberately
