# each, not two), but not worth a sixth probe round.
# Coverage cost is absorbed: the Gulf counterweight survives via aawsat +
# sky_news_arabia, resistance-axis framing survives via al_manar, and three Hebrew
# feeds remain. Only the right-leaning Israeli line (israel_hayom) has no substitute.

