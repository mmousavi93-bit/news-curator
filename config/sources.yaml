# sources.yaml -- THE one file you edit to add or remove a feed.
#
# GENERATED 2026-08-17 from the merged probe verdicts (r4 + tg1 + r5). Every url here
# was answered 200 with parseable items by a GitHub US runner -- the same network the
# pipeline runs on. Do not hand-edit a url without re-probing it.
#
# 51 sources staged, 10 ENABLED. Phase 3 is the THIN SLICE; Phase 8 is "widen sources".
# The other 41 are staged with enabled: false so Phase 8 is flipping flags, not redoing
# five rounds of probing. The join check in Phase 3 covers all 51, disabled included.
#
# The 10 enabled deliberately span every axis the collectors must handle: rss + telegram,
# en/fa/ar/he, and tier 1/2/3/lead. Four are included BECAUSE they are known-broken:
# ynet_he (probe returns no date -- DATE_RE does not match Ynet's format) and all THREE
# telegram feeds (t.me/s/ has no pubDate at all; times live in <time datetime=...>).
# Phase 3 must fix both or the 30-minute near-duplicate window cannot work.
#
# ITEM COUNTS BELOW AND IN THE PROBE CSVs ARE PRE-CAP. collection.max_items_per_source is
# 20, so the 10 enabled sources yield a post-cap ceiling of 210, not the ~328 they return.
# The Phase 3 gate floor is 160. Do not quote 328 as a gate number.
#
# CUT 2026-08-17, owner-approved: seeking_alpha, cnbc, oilprice, npr, wotr. Market colour
# and commentary, not event detection. See config/source_prune_sheet.csv.
#
# ---------------------------------------------------------------------------
# THE JOIN RULE -- read this before typing anything.
#
#   `id` here MUST match a key under `sources:` in config/credibility.yaml.
#
# That is the only link between "where do I fetch" (this file) and "how much do
# I trust it" (credibility.yaml). A typo does not error -- it silently falls
# through to credibility.yaml `defaults:` (tier 3, own group), which means a
# Reuters wire report gets scored as an anonymous OSINT channel. Every id you
# write here must already exist there, or you add it there in the same edit.
# ---------------------------------------------------------------------------


