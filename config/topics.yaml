# Topic gate for sources marked `topic_gate: true` in sources.yaml
# (session-5 decision 1: reversible volume reduction, never a deletion).
#
# A gated item is KEPT when any keyword below matches its title or body
# (case-insensitive substring). The item's LANGUAGE selects the list. If the
# item's language has no list here, the item passes (fail-open -- a gate that
# silently drops possibly-relevant items is worse than no gate).
#
# Non-gated sources are never filtered, whatever their language.
#
# Owner-editable: add or remove words freely. Each list must be a YAML list
# of strings; pipeline/filter.py validates the shape and fails the run on a
# typo rather than guessing.

